<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>APEX PREDICTION PANEL — PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Updated to use a more transparent card */
  :root{
    --blue:#007bff;
    --blue2:#00a2ff;
    --red:#ff004c;
    --green:#00ff66;
    --orange:#ff9900;
    --bg:#000;
    /* Card is semi-transparent */
    --card:rgba(10,10,10,0.8); 
    --border:#1a1a1a;
    --text:#f5f5f5;
    --muted:#bbbbbb;
    font-family:'Poppins',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;}
  
  /* Static image background for the prediction page */
  .bg-image{
    position:fixed;inset:0;z-index:-2;
    width:100%;height:100%;object-fit:cover;
    background-image: url('anime.png'); 
    background-size: cover;
    background-position: center;
  }
  .overlay{
    position:fixed;inset:0;z-index:-1;
    background:rgba(0,0,0,0.65); /* Increased overlay for better readability */
  }
  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:min(600px,95%);
    background:var(--card);
    border-radius:18px;
    border:1px solid var(--border);
    box-shadow:0 0 24px rgba(0,0,0,0.7);
    padding:20px;
  }
  .hidden{display:none}
  /* Prediction Page Styles */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .pred-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .pred-row input{
    flex:1;
    border:2px solid var(--blue);
    background:rgba(0,0,50,0.5); /* Semi-transparent input */
    padding:12px;
    border-radius:8px;
    color:#fff;font-size:15px;outline:none;
  }
  button{cursor:pointer;font-weight:700;border:none;border-radius:8px;}
  #genBtn{
    background:var(--red);
    color:#fff;
    padding:12px 16px;
  }
  #markWin{
    background:var(--green);
    color:#000;
    padding:9px 14px;
  }
  #markLoss{
    background:var(--red);
    color:#fff;
    padding:9px 14px;
  }
  #predictionOutput{
    text-align:center;
    font-size:52px;
    font-weight:800;
    margin-top:16px;
    text-shadow:0 0 14px rgba(255,255,255,0.35);
  }
  .stats{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    color:var(--muted);
    flex-wrap:wrap;
    gap:8px;
  }
  .history{
    margin-top:14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(17, 17, 17, 0.7); /* Semi-transparent history */
    padding:8px;
    max-height:230px;
    overflow:auto;
  }
  .history-item{
    display:flex;
    justify-content:space-between;
    padding:9px;
    border-bottom:1px dashed rgba(255,255,255,0.08);
    border-left:4px solid transparent;
    border-radius:6px;
    margin-bottom:5px;
    font-size:13px;
  }
  .history-item.red{border-left-color:var(--red);}
  .history-item.green{border-left-color:var(--green);}
  .history-item.blue{border-left-color:var(--blue2);}
  .history-item.orange{border-left-color:var(--orange);}
  .history-item:last-child{border-bottom:none;}

  #countdown{color:#00ff00;font-weight:600;}

  /* admin */
  .admin-dot{
    position:fixed;
    right:10px;
    bottom:14px;
    width:34px;height:34px;
    opacity:0.02;
    z-index:99;
  }
  .admin-panel{
    position:fixed;
    right:10px;
    bottom:60px;
    width:340px;
    background:#111;
    color:#fff;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--border);
    display:none;
    z-index:100;
    font-size:13px;
  }
  .admin-panel h4{margin:4px 0 8px;}
  .admin-panel input, .admin-panel select{
    width:100%;
    margin:4px 0;
    padding:8px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#181818;
    color:#fff;
    outline:none;
    font-size:13px;
  }
  .admin-panel button{
    padding:8px 12px;
    margin-top:6px;
    border-radius:6px;
    background:var(--red);
    color:#fff;
  }

  @media(max-width:480px){
    .stats{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>

<div class="bg-image"></div>
<div class="overlay"></div>

<div class="wrap">
  <div class="card" id="predictCard">
    <div class="topbar">
      <div>
        <h3 id="panelGameName">--</h3>
        <div class="muted">Period: <span id="periodNumber">--</span></div>
      </div>
      <div style="text-align:right">
        <div class="muted">Your Key: <b id="keyShow">--</b></div>
        <div class="muted">Method: <b id="methodShow">random</b></div>
        <div class="muted">Server: <b style="color:#00ff66">ONLINE</b></div>
      </div>
    </div>

    <div class="pred-row">
      <input id="periodInput" value="">
      <button id="genBtn">Generate Prediction</button>
    </div>
    <div class="muted" style="text-align:right;margin-top:4px;">
      Expires in: <span id="countdown">--:--:--</span>
    </div>

    <div id="predictionOutput">—</div>

    <div class="stats">
      <div>Total: <b id="totalCount">0</b></div>
      <div>Wins: <b id="winCount">0</b></div>
      <div>Loss: <b id="lossCount">0</b></div>
      <div>
        <button id="markWin">MARK WIN</button>
        <button id="markLoss">MARK LOSS</button>
      </div>
    </div>

    <div class="history" id="historyList">
      <div class="muted">Loading history...</div>
    </div>
    
    <div style="margin-top:15px;text-align:center;">
        <button id="logoutBtn" style="background:var(--blue); color:#fff; padding:8px 15px; border-radius:8px;">LOGOUT</button>
    </div>
  </div>
</div>

<div id="adminDot" class="admin-dot"></div>
<div id="adminPanel" class="admin-panel">
  <h4>Admin Panel</h4>
  <div>Generate timed license key</div>
  <label>Duration Value</label>
  <input type="number" id="admDuration" value="24" min="1">
  <label>Duration Unit</label>
  <select id="admUnit">
    <option value="minutes">Minutes</option>
    <option value="hours" selected>Hours</option>
    <option value="days">Days</option>
    <option value="months">Months</option>
  </select>
  <button id="admCreateKey">Create Key</button>
  <div id="admMsg" style="margin-top:6px;color:var(--muted);font-size:12px;"></div>
</div>

<script type="module">
  // ---------- Firebase config and initialization (Must be included on both pages) ----------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import { getDatabase, ref, set, get, push, update } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBs7eQyMrcN8kJWMHl2ac2UZHlYQ6DypD8",
    authDomain: "terminal-xxrr.firebaseapp.com",
    databaseURL: "https://terminal-xxrr-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "terminal-xxrr",
    storageBucket: "terminal-xxrr.firebasestorage.app",
    messagingSenderId: "722753278120",
    appId: "1:722753278120:web:bfa37aab39635a4e57f29d",
    measurementId: "G-E3MZH3E1K5"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // ---------- ELEMENTS ----------
  const panelGameName = document.getElementById('panelGameName');
  const periodNumber  = document.getElementById('periodNumber');
  const periodInput   = document.getElementById('periodInput');
  const genBtn        = document.getElementById('genBtn');
  const predictionOutput = document.getElementById('predictionOutput');
  const methodShow    = document.getElementById('methodShow');
  const keyShow       = document.getElementById('keyShow');

  const totalCount = document.getElementById('totalCount');
  const winCount   = document.getElementById('winCount');
  const lossCount  = document.getElementById('lossCount');
  const historyList= document.getElementById('historyList');
  const markWin    = document.getElementById('markWin');
  const markLoss   = document.getElementById('markLoss');
  const countdownEl= document.getElementById('countdown');
  const logoutBtn  = document.getElementById('logoutBtn');
  
  const adminDot   = document.getElementById('adminDot');
  const adminPanel = document.getElementById('adminPanel');
  const admDuration= document.getElementById('admDuration');
  const admUnit    = document.getElementById('admUnit');
  const admCreateKey = document.getElementById('admCreateKey');
  const admMsg     = document.getElementById('admMsg');

  // Load state from localStorage
  let activeKey = localStorage.getItem('activeKey');
  let expiryTime = parseInt(localStorage.getItem('expiryTime'), 10);
  let gameName   = localStorage.getItem('gameName');
  let initialPeriod = localStorage.getItem('period');
  let countdownTimer = null;
  
  // --- Initialization and Security Check ---
  if (!activeKey || !expiryTime || Date.now() > expiryTime) {
      alert("Session expired or invalid. Please log in again.");
      localStorage.clear(); // Clear potentially stale data
      window.location.href = "index.html"; // Redirect to login page
  } else {
      // Set the display values
      keyShow.textContent = activeKey;
      panelGameName.textContent = gameName || "GAME";
      periodNumber.textContent  = initialPeriod || "2025";
      periodInput.value         = initialPeriod || "2025";

      startCountdown(expiryTime);
      loadHistoryForKey(activeKey);
  }
  
  // --- Admin Panel Logic (Copied from original for key creation) ---
  adminDot.onclick = ()=>{
    const pass = prompt("Enter admin code:");
    if(pass === "456"){
      adminPanel.style.display = adminPanel.style.display==='block'?'none':'block';
    } else if(pass !== null){
      alert("Wrong code");
    }
  };

  admCreateKey.onclick = async ()=>{
    const durVal = parseInt(admDuration.value || "1",10);
    const unit   = admUnit.value;
    if(durVal <= 0) { alert("Duration invalid"); return; }

    let ms = 0;
    if(unit==="minutes") ms = durVal*60*1000;
    else if(unit==="hours") ms = durVal*60*60*1000;
    else if(unit==="days") ms = durVal*24*60*60*1000;
    else if(unit==="months") ms = durVal*30*24*60*60*1000;

    const now = Date.now();
    const expires = now + ms;
    const key = Math.random().toString(36).slice(2,10).toUpperCase();

    await set(ref(db,"licenseKeys/"+key),{
      key,
      createdAt: now,
      expires,
      unit,
      duration: durVal
    });

    admMsg.textContent = "New key: "+key+"  (expires: "+new Date(expires).toLocaleString()+")";
  };
  // --- End Admin Panel Logic ---

  function startCountdown(expTs){
    if(countdownTimer) clearInterval(countdownTimer);
    const tick = ()=>{
      const diff = expTs - Date.now();
      if(diff <= 0){
        countdownEl.textContent = "EXPIRED";
        alert("License expired");
        localStorage.clear();
        window.location.href = "index.html"; // Redirect on expiration
        return;
      }
      const s = Math.floor(diff/1000)%60;
      const m = Math.floor(diff/60000)%60;
      const h = Math.floor(diff/3600000);
      countdownEl.textContent =
        String(h).padStart(2,'0')+":"+
        String(m).padStart(2,'0')+":"+
        String(s).padStart(2,'0');
    };
    tick();
    countdownTimer = setInterval(tick,1000);
  }

  // ---------- PREDICTION LOGIC (Same as original) ----------
  let total=0,wins=0,loss=0;
  let history = []; 

  genBtn.onclick = async ()=>{
    if(!activeKey){ alert("Not logged in"); return; } // Should not happen if initial check is correct

    genBtn.disabled = true;
    genBtn.textContent = "Analyzing...";
    await new Promise(r=>setTimeout(r,1800));

    const options = ["RED","GREEN","SMALL","BIG"];
    const pick = options[Math.floor(Math.random()*options.length)];
    showPrediction(pick);

    await savePredictionToFirebase(pick);
    await loadHistoryForKey(activeKey); 

    genBtn.disabled = false;
    genBtn.textContent = "Generate Prediction";
  };

  function showPrediction(p){
    predictionOutput.textContent = p;
    const col = {
      "RED"  : "#ff004c", "GREEN": "#00ff66",
      "SMALL": "#00a2ff", "BIG"  : "#ff9900"
    }[p] || "#ffffff";
    predictionOutput.style.color = col;

    const methods = ["repeat","zig zag pattern","dragon pattern","mirror","random"];
    methodShow.textContent = methods[Math.floor(Math.random()*methods.length)];
  }

  async function savePredictionToFirebase(pred){
    const per = periodInput.value || periodNumber.textContent;
    const obj = {
      period: per,
      prediction: pred,
      timestamp: Date.now(),
      result: "PENDING"
    };
    const pRef = push(ref(db,"predictions/"+activeKey));
    await set(pRef,obj);
    incrementPeriod();
  }

  function incrementPeriod(){
    let val = periodInput.value || "0";
    if(/^\d+$/.test(val)){
      val = String(BigInt(val)+1n);
    } else {
      val = val + "1";
    }
    periodInput.value = val;
    periodNumber.textContent = val;
    localStorage.setItem('period', val); // Update period in local storage too
  }

  async function loadHistoryForKey(key){
    const snap = await get(ref(db,"predictions/"+key));
    historyList.innerHTML = "";
    history = [];
    total = wins = loss = 0;

    if(!snap.exists()){
      historyList.innerHTML = "<div class='muted'>No predictions yet</div>";
      updateStats();
      return;
    }

    const data = snap.val();
    const rows = Object.entries(data).map(([id,val])=>({id,...val}))
      .sort((a,b)=>b.timestamp-a.timestamp);

    history = rows;

    rows.forEach(r=>{
      total++;
      if(r.result === "WIN") wins++;
      if(r.result === "LOSS") loss++;

      const div = document.createElement('div');
      const colorClass = {
        "RED":"red", "GREEN":"green",
        "SMALL":"blue", "BIG":"orange"
      }[r.prediction] || "";
      div.className = "history-item "+colorClass;

      const predColor = {
        "RED":"#ff004c", "GREEN":"#00ff66",
        "SMALL":"#00a2ff", "BIG":"#ff9900"
      }[r.prediction] || "#ffffff";

      div.innerHTML = `
        <div>
          <b style="color:${predColor}">${r.prediction}</b> •
          ${new Date(r.timestamp).toLocaleString()}<br>
          <span class="muted" style="font-size:11px;">Period ${r.period}</span>
        </div>
        <div style="text-align:right;">
          <b>${r.result}</b><br>
          <span class="muted" style="font-size:11px;">${r.id.slice(-6)}</span>
        </div>
      `;
      historyList.appendChild(div);
    });

    updateStats();
  }

  function updateStats(){
    totalCount.textContent = total;
    winCount.textContent   = wins;
    lossCount.textContent  = loss;
  }

  // MARK WIN / LOSS -> last pending prediction
  markWin.onclick  = ()=> markResult("WIN");
  markLoss.onclick = ()=> markResult("LOSS");

  async function markResult(res){
    if(!activeKey){ alert("Not logged in"); return; }
    if(history.length===0){ alert("No predictions"); return; }

    const target = history.find(h=>h.result==="PENDING");
    if(!target){ alert("No PENDING prediction"); return; }

    await update(ref(db,`predictions/${activeKey}/${target.id}`),{
      result:res,
      markedAt:Date.now()
    });
    await loadHistoryForKey(activeKey);
  }
  
  // --- Logout Functionality ---
  logoutBtn.onclick = () => {
      if(confirm("Are you sure you want to log out?")){
          localStorage.clear();
          if(countdownTimer) clearInterval(countdownTimer);
          window.location.href = "index.html";
      }
  };

</script>
</body>
</html>
