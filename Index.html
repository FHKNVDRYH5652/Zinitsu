<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>APEX PREDICTION PANEL — PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Updated to use a more transparent card */
  :root{
    --blue:#007bff;
    --blue2:#00a2ff;
    --red:#ff004c;
    --green:#00ff66;
    --orange:#ff9900;
    --bg:#000;
    /* Changed card background to be semi-transparent */
    --card:rgba(10,10,10,0.8); 
    --border:#1a1a1a;
    --text:#f5f5f5;
    --muted:#bbbbbb;
    font-family:'Poppins',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;}
  
  /* Removed muted attribute to enable video audio */
  video.bg{
    position:fixed;inset:0;z-index:-2;
    width:100%;height:100%;object-fit:cover;
  }
  .overlay{
    position:fixed;inset:0;z-index:-1;
    background:rgba(0,0,0,0.55);
  }
  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:min(600px,95%);
    /* Use the semi-transparent variable */
    background:var(--card); 
    border-radius:18px;
    border:1px solid var(--border);
    box-shadow:0 0 24px rgba(0,0,0,0.7);
    padding:20px;
  }
  .hidden{display:none}
  .logo{
    width:110px;height:110px;border-radius:999px;
    border:3px solid rgba(255,255,255,0.15);
    display:block;margin:0 auto;
  }
  h2{text-align:center;margin:6px 0 10px;}
  .muted{color:var(--muted);font-size:13px;}
  .field{margin:10px 0;}
  label{display:block;margin-bottom:4px;font-size:14px;color:var(--muted);}
  input{
    width:100%;padding:12px;
    border-radius:8px;border:1px solid var(--border);
    background:rgba(17, 17, 17, 0.7); /* Semi-transparent input background */
    color:#fff;font-size:15px;outline:none;
  }
  input[readonly]{opacity:0.85;}
  button{cursor:pointer;font-weight:700;border:none;border-radius:8px;}
  .btn-main{
    background:var(--red);
    color:#fff;
    padding:12px 18px;
  }
  .btn-secondary{
    background:transparent;
    padding:12px 18px;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .search-btn{
    margin:8px 0 14px;
    padding:12px 18px;
    text-align:center;
    background:var(--blue);
    color:#fff;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
  }
  .spinner{
    width:20px;height:20px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,0.25);
    border-top-color:#fff;
    display:inline-block;
    margin-left:8px;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* modal */
  .modal-back{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.6);
    display:none;align-items:center;justify-content:center;
    z-index:10;
  }
  .modal{
    width:min(400px,90%);
    max-height:80vh;
    overflow:auto;
    background:#fff;
    color:#111;
    border-radius:10px;
    padding:12px;
  }
  .modal h3{margin:6px 8px 10px;}
  .game-item{
    padding:10px;
    border-bottom:1px solid #eee;
    cursor:pointer;
  }
  .game-item:hover{background:#f2f2f2;}
  
  /* HIDDEN ADMIN STYLES REMOVED FOR BREVITY IN LOGIN PAGE, but kept in prediction for key generation */
</style>
</head>
<body>

<video class="bg" autoplay loop playsinline>
  <source src="anime.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="wrap">
  <div class="card" id="loginCard">
    <img src="logo.png" class="logo" alt="Logo">
    <h2>@APEX PREDICTION PANEL</h2>

    <div id="searchBtn" class="search-btn">
      SEARCH VERSION <span id="searchSpin" class="spinner" style="display:none"></span>
    </div>

    <div class="field">
      <label>Game Version</label>
      <input id="gameVersion" readonly>
    </div>
    <div class="field">
      <label>Game Name</label>
      <input id="gameName" readonly>
    </div>
    <div class="field">
      <label>Play Mode</label>
      <input id="playMode" value="SAFE { 100% Accuracy }" readonly>
    </div>
    <div class="field">
      <label>License Key</label>
      <input id="licenseKey" placeholder="Enter your license key">
    </div>

    <div class="btn-row">
      <button class="btn-main" id="getKeyBtn">GET KEY</button>
      <button class="btn-secondary" id="loginBtn">LOGIN</button>
    </div>
  </div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3>SELECT PRO GAME MOD's !</h3>
    <div id="gameList"></div>
  </div>
</div>

<div id="adminDot" class="admin-dot"></div>
<div id="adminPanel" class="admin-panel hidden">
  </div>

<script type="module">
  // ---------- Firebase config and initialization (Must be included on both pages) ----------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import { getDatabase, ref, set, get, push } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBs7eQyMrcN8kJWMHl2ac2UZHlYQ6DypD8",
    authDomain: "terminal-xxrr.firebaseapp.com",
    databaseURL: "https://terminal-xxrr-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "terminal-xxrr",
    storageBucket: "terminal-xxrr.firebasestorage.app",
    messagingSenderId: "722753278120",
    appId: "1:722753278120:web:bfa37aab39635a4e57f29d",
    measurementId: "G-E3MZH3E1K5"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // ---------- ELEMENTS ----------
  const searchBtn  = document.getElementById('searchBtn');
  const searchSpin = document.getElementById('searchSpin');
  const modalBack  = document.getElementById('modalBack');
  const gameList   = document.getElementById('gameList');

  const gameVersion = document.getElementById('gameVersion');
  const gameName    = document.getElementById('gameName');
  const licenseKey  = document.getElementById('licenseKey');

  const getKeyBtn = document.getElementById('getKeyBtn');
  const loginBtn  = document.getElementById('loginBtn');
  
  // ---------- GAME LIST ----------
  const GAMES = [
    "OK WIN {PRO LZR}", "6 CLUB {PRO LZR}", "TIRANGA {PRO LZR}", 
    "BDG WIN {PRO LZR}", "91 CLUB {PRO LZR}", "GOA GAMES {PRO LZR}", 
    "TASHAN WIN {PRO LZR}", "51 GAME {PRO LZR}", "82 LOTTERY {PRO LZR}", 
    "JALWA GAME {PRO LZR}"
  ];
  
  // Populate Game List and set selection logic
  GAMES.forEach(name=>{
    const row = document.createElement('div');
    row.className = 'game-item';
    row.textContent = name;
    row.onclick = ()=>{
      gameName.value = name;
      // Note: Re-using the initial logic to generate a random version
      gameVersion.value = "2025" + Math.floor(Math.random()*900+100); 
      modalBack.style.display='none';
    };
    gameList.appendChild(row);
  });

  // default initial values (as in original code)
  gameName.value = "91 CLUB {PRO LZR}";
  gameVersion.value = "2025753";

  // ---------- SEARCH VERSION (2 sec) ----------
  searchBtn.onclick = async ()=>{
    searchSpin.style.display = 'inline-block';
    await new Promise(r=>setTimeout(r,2000));
    searchSpin.style.display = 'none';
    modalBack.style.display = 'flex';
  };
  modalBack.onclick = e=>{
    if(e.target === modalBack) modalBack.style.display='none';
  };

  // ---------- GET KEY BUTTON ----------
  getKeyBtn.onclick = ()=> {
    window.open("https://t.me/Predict456","_blank");
  };

  // ---------- LOGIN + LICENSE CHECK (Redirecting to prediction page) ----------
  loginBtn.onclick = async ()=>{
    const key = (licenseKey.value || '').trim();
    const selectedGameName = gameName.value;
    const selectedPeriod = gameVersion.value; 

    if(!key){ alert("Enter license key"); return; }
    if(!selectedGameName || !selectedPeriod){ alert("Select Game Version/Name first"); return; }


    const snap = await get(ref(db,"licenseKeys/"+key));
    if(!snap.exists()){
      alert("Invalid key");
      return;
    }
    const data = snap.val();
    if(Date.now() > data.expires){
      alert("Key expired");
      return;
    }
    
    // License is valid: Store data in localStorage and redirect
    localStorage.setItem('activeKey', key);
    localStorage.setItem('gameName', selectedGameName);
    localStorage.setItem('period', selectedPeriod);
    localStorage.setItem('expiryTime', data.expires);

    window.location.href = "prediction.html"; // Redirect to the prediction page
  };
  
  // small: enter key on license field triggers login
  licenseKey.addEventListener('keydown',e=>{
    if(e.key==="Enter") loginBtn.click();
  });
  
  // Minimal Admin Panel logic for key creation (kept here for simplicity of not duplicating)
  const admDuration= document.getElementById('admDuration');
  const admUnit    = document.getElementById('admUnit');
  const admCreateKey = document.getElementById('admCreateKey');
  const admMsg     = document.getElementById('admMsg');
  
  // Re-add admin logic from original code (but without the full panel HTML on this page)
  admCreateKey.onclick = async ()=>{
    // ... (same key creation logic as in the original Index (12).html) ...
    const durVal = parseInt(admDuration.value || "1",10);
    const unit   = admUnit.value;
    if(durVal <= 0) { alert("Duration invalid"); return; }

    let ms = 0;
    if(unit==="minutes") ms = durVal*60*1000;
    else if(unit==="hours") ms = durVal*60*60*1000;
    else if(unit==="days") ms = durVal*24*60*60*1000;
    else if(unit==="months") ms = durVal*30*24*60*60*1000;

    const now = Date.now();
    const expires = now + ms;
    const key = Math.random().toString(36).slice(2,10).toUpperCase();

    await set(ref(db,"licenseKeys/"+key),{
      key,
      createdAt: now,
      expires,
      unit,
      duration: durVal
    });

    admMsg.textContent = "New key: "+key+"  (expires: "+new Date(expires).toLocaleString()+")";
  };
  
  const adminDot   = document.getElementById('adminDot');
  const adminPanel = document.getElementById('adminPanel');
  
  adminDot.onclick = ()=>{
    const pass = prompt("Enter admin code:");
    if(pass === "456"){
      // Toggle visibility, but since panel is minimal/hidden, this is mostly symbolic
      adminPanel.classList.toggle('hidden'); 
    } else if(pass !== null){
      alert("Wrong code");
    }
  };


</script>
</body>
</html>
